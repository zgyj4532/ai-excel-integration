# Server
server.port=${SERVER_PORT:8080}

# Response compression (gzip)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# H2 Database (in-memory, low footprint)
spring.datasource.url=jdbc:h2:mem:aiexcel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# H2 Console (disabled for production)
spring.h2.console.enabled=false

# Connection pool (HikariCP) - low footprint for 2c2g
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JPA open-in-view off (reduce memory)
spring.jpa.open-in-view=false

# Disable unused starters
spring.data.redis.repositories.enabled=false

# Actuator endpoints
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
