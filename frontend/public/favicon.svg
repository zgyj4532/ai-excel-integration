<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IC favicon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#b3852f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#05070a" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#05070a" flood-opacity="0.6" />
    </filter>
    <path id="cloud" d="M14 30c-0.6-8 6-14 14-14 5.8 0 10.6 3 12.5 7.5C42 22 45 20 48.5 20 55 20 60 24.5 60 30.5 60 36.5 55.2 42 48.2 42H20c-6 0-10.5-4.6-10.5-10.5 0-0.5 0-1 0.1-1.5z" />
